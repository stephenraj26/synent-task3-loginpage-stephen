<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Welcome Back</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="title">
      <div class="logo" aria-hidden="true">S</div>
      <h1 id="title">Welcome back</h1>
      <p class="sub">Log in to continue to your account.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
          <p class="error" id="emailError" role="alert"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" id="showBtn" class="show" aria-label="Show password">Show</button>
          </div>
          <p class="error" id="passwordError" role="alert"></p>
        </div>

        <a href="#" class="forgot">Forgot Password?</a>

        <button type="submit" class="login-btn">Login</button>
        <p class="ok" id="okMsg" role="status"></p>
      </form>

      <p class="signup">New here? <a href="#">Create an account</a></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
